server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: mime.types is inherited from the main http{} block (it maps html, css,
    # js and — on modern nginx — wasm). Do NOT add a bare `types { }` block here:
    # a types block REPLACES the inherited map rather than extending it, which would
    # leave index.html without a type, fall back to application/octet-stream, and make
    # browsers DOWNLOAD the page instead of rendering it.

    # SPA fallback: unknown routes are handled by the Blazor router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache the immutable framework/asset files.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Belt-and-suspenders: guarantee the correct wasm type regardless of the base
    # image's mime.types version.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
