server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for Blazor WebAssembly.
    types {
        application/wasm wasm;
    }

    # SPA fallback: unknown routes are handled by the Blazor router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache the immutable framework/asset files.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
