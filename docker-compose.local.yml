version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: overblikplus-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - overblikplus-network

  # User Microservice
  user-service:
    build:
      context: ./OverblikPlusBackend/UserMicroService
      dockerfile: Dockerfile
    container_name: overblikplus-user-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
    ports:
      - "5001:80"
    depends_on:
      - sqlserver
    networks:
      - overblikplus-network

  # Task Microservice
  task-service:
    build:
      context: ./OverblikPlusBackend/TaskMicroService
      dockerfile: Dockerfile
    container_name: overblikplus-task-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TaskDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
    ports:
      - "5002:80"
    depends_on:
      - sqlserver
    networks:
      - overblikplus-network

  # Frontend (Blazor WebAssembly)
  frontend:
    build:
      context: ./OverblikPlus
      dockerfile: Dockerfile
    container_name: overblikplus-frontend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UserService__BaseUrl=http://user-service
      - TaskService__BaseUrl=http://task-service
      - CalendarEventService__BaseUrl=http://task-service
      - ActivityService__BaseUrl=http://task-service
    ports:
      - "5000:80"
    depends_on:
      - user-service
      - task-service
    networks:
      - overblikplus-network

volumes:
  sqlserver_data:

networks:
  overblikplus-network:
    driver: bridge
