services:
  # Azurite (Azure Storage Emulator for Blob Storage)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: overblikplus-azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    networks:
      - overblikplus-network

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: overblikplus-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - overblikplus-network

  # User Microservice
  user-service:
    build:
      context: ./OverblikPlusBackend
      dockerfile: UserMicroService/Dockerfile
    container_name: overblikplus-user-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__DBConnectionString=Server=sqlserver;Database=UserDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__BlobStorageConnectionString=UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite;
      - ENCRYPTION_KEY=d0aeXMamTP1Atr3q8VmsabazTVbeBzTF
      - Jwt__Key=MyLocalJwtKeyForDevelopment123456789012345678901234567890
      - Jwt__Issuer=http://localhost:5001
      - Jwt__Audience=http://localhost:5001
      - EF_CORE_MIGRATIONS=true
    ports:
      - "5001:80"
    depends_on:
      - sqlserver
      - azurite
    networks:
      - overblikplus-network

  # Task Microservice
  task-service:
    build:
      context: ./OverblikPlusBackend
      dockerfile: TaskMicroService/Dockerfile
    container_name: overblikplus-task-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TaskDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__DBConnectionString=Server=sqlserver;Database=TaskDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__BlobStorageConnectionString=UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite;
      - Jwt__Key=MyLocalJwtKeyForDevelopment123456789012345678901234567890
      - Jwt__Issuer=http://localhost:5001
      - Jwt__Audience=http://localhost:5001
    ports:
      - "5002:80"
    depends_on:
      - sqlserver
      - azurite
    networks:
      - overblikplus-network

volumes:
  sqlserver_data:

networks:
  overblikplus-network:
    driver: bridge
